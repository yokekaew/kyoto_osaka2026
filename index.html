var DAY_EMO = { D4: '', D5: '', D6: '', D7: '', D8: '', D9: '', D10: '', D11: '', D12: '' };
var EMO = [[/HX6|ขึ้นเครื่อง|ตม\./, ''], [/Tax-free/, ''], [/ecbo|รับกระเป๋า|แพ็กกระเป๋า|จัดกระเป๋า/, ''], [/^กลับที่พัก|เช็กอิน|เช็กเอาต์|check-in|ไปที่พัก|ไปโรงแรม/i, ''], [/7-Eleven|FamilyMart|ร้านสะดวกซื้อ/, ''], [/teamLab/, ''], [/Kaiyukan/, ''], [/Yakiniku/, ''], [/ราเมง|Kairikiya|Ramen/, ''], [/Christmas/, ''], [/กิโมโน|Kimono|คืนชุด/, ''], [/จักรยาน/, ''], [/มื้อเช้า/, ''], [/รถบัส|JR Bus|Bus|รถเมล์/, ''], [/^(ไป|กลับ)/, ''], [/Haruka|Kintetsu|Nankai|รถไฟ|Subway|Randen|Eizan|Hankyu:/, ''], [/Nara Park/, ''], [/ป่าไผ่/, ''], [/Katsuo-ji/, ''], [/Kamo Delta/, ''], [/หมู่บ้าน/, ''], [/เรือ/, ''], [/จักรยาน/, ''], [/ของหวาน|โมจิ|Futaba|CAFE|ขนม|Surugaya/, ''], [/Onigiri|มื้อ|Nagisa|ตลาด|Kuromon|Nishiki/, ''], [/Fushimi|Inari|Kasuga|Yasaka|Shrine/, ''], [/Kiyomizu|Todai-ji|Hozenji|Ninna-ji|Temple|วัด/, ''], [/Hakuryu|Rurikoin|Yusai|Kameyama|ลำธาร|สันทราย|Togetsukyo|สะพาน|Uji/, ''], [/ช้อปปิ้ง|Den Den|Shinsaibashi|Umeda|Don Quijote|SURUGA|Teramachi|Dotonbori/, ''], [/Gion|เดิน/, '']];
function emoOf(t) { for (var i = 0; i < EMO.length; i++) { if (EMO[i][0].test(t)) return EMO[i][1]; } return ''; }
var TAG_ORDER = ['p', 'b', 'c', 'l', 'v'];
var TAG_LABEL = { p: 'ยังต้องจอง', b: 'จองแล้ว', c: 'เงินสด', l: 'ห้ามพลาดเวลา', v: '[ตรวจสอบ]' };

function jstNow(ms) {
  var d = new Date(ms + 9 * 3600000);
  return { iso: d.toISOString().slice(0, 10), min: d.getUTCHours() * 60 + d.getUTCMinutes() };
}

function mins(t) {
  var m = t.match(/\d{1,2}:\d{2}/g) || [];
  return m.map(function (x) { var p = x.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); });
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.D = tripDays();
    var j = jstNow(Date.now());
    var idx = this.D.findIndex(function (d) { return d.iso === j.iso; });
    this.state = { tab: 'days', day: idx >= 0 ? idx : 0, now: Date.now() };
  }
  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () { self.setState({ now: Date.now() }); }, 60000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  toDay() { setTimeout(function () { var el = document.querySelector('.dayhead'); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 30); }

  renderVals() {
    var self = this;
    var D = this.D;
    var j = jstNow(this.state.now);
    var todayIdx = D.findIndex(function (d) { return d.iso === j.iso; });
    var di = Math.max(0, Math.min(D.length - 1, this.state.day));
    var day = D[di];
    var isToday = di === todayIdx;

    var statusLine;
    if (todayIdx >= 0) {
      statusLine = 'วันนี้ ' + D[todayIdx].code + ' · ' + D[todayIdx].dow + ' ' + D[todayIdx].date + ' (เวลาญี่ปุ่น)';
    } else {
      var start = Date.UTC(2026, 11, 3);
      var todayUTC = Date.parse(j.iso + 'T00:00:00Z');
      var left = Math.round((start - todayUTC) / 86400000);
      statusLine = left > 0 ? ('อีก ' + left + ' วัน · นัดเจอสุวรรณภูมิ 22:30 วันพฤหัสที่ 3 ธ.ค.') : (left === 0 ? 'คืนนี้นัดเจอสุวรรณภูมิ 22:30' : 'จบทริปแล้ว');
    }

    var nowIdx = -1, nextIdx = -1;
    if (isToday) {
      day.items.forEach(function (it, i) {
        var m = mins(it.t);
        if (!m.length) return;
        var s = m[0], e = m.length > 1 ? m[1] : s + 30;
        if (nowIdx < 0 && j.min >= s && j.min < e) nowIdx = i;
      });
      if (nowIdx < 0) {
        nextIdx = day.items.findIndex(function (it) { var m = mins(it.t); return m.length && m[0] > j.min; });
      }
    }

    var items = day.items.map(function (it, i) {
      var parts = it.t.split('–');
      var tags = [];
      if (i === nowIdx) tags.push({ k: 'now', label: 'ตอนนี้' });
      if (i === nextIdx) tags.push({ k: 'next', label: 'ถัดไป' });
      TAG_ORDER.forEach(function (f) { if (it.flags.indexOf(f) >= 0) tags.push({ k: f, label: TAG_LABEL[f] }); });
      var key = it.flags.indexOf('k') >= 0 || it.flags.indexOf('b') >= 0;
      var cls = i === nowIdx ? 'now' : (i === nextIdx ? 'next' : (key ? '' : 'minor'));
      return {
        tA: parts[0], tB: parts.length > 1 && parts[1] ? parts[1] : '',
        title: it.title, emo: emoOf(it.title), note: it.note, how: it.how, cost: it.cost,
        tags: tags, hasTags: tags.length > 0, cls: cls,
        map: it.q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(it.q) : ''
      };
    });

    var chips = D.map(function (d, i) {
      var cls = (i === di ? 'on' : '') + (i === todayIdx ? ' today' : '');
      return { code: d.code, emo: DAY_EMO[d.code] || '', sub: d.dow + ' ' + d.date.replace(' ธ.ค.', ''), cls: cls, pick: function () { self.setState({ day: i, tab: 'days' }); } };
    });

    var tabDefs = [['days', 'แผนรายวัน'], ['info', 'ข้อมูลหลัก'], ['money', 'ค่าใช้จ่าย'], ['tips', 'ข้อควรระวัง']];
    var tabs = tabDefs.map(function (t) {
      return { label: t[1], cls: self.state.tab === t[0] ? 'on' : '', pick: function () { self.setState({ tab: t[0] }); } };
    });

    return {
      statusLine: statusLine,
      tabs: tabs,
      chips: chips,
      day: day,
      dayEmo: DAY_EMO[day.code] || '',
      items: items,
      showDays: this.state.tab === 'days',
      showInfo: this.state.tab === 'info',
      showMoney: this.state.tab === 'money',
      showTips: this.state.tab === 'tips',
      isFirst: di === 0,
      isLast: di === D.length - 1,
      prevDay: function () { self.setState({ day: Math.max(0, di - 1) }); self.toDay(); },
      nextDay: function () { self.setState({ day: Math.min(D.length - 1, di + 1) }); self.toDay(); }
    };
  }
}
