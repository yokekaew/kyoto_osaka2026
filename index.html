<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japan Trip Kansai Dec 2026</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Noto+Serif+Thai:wdth,wght@62.5..100,400..700&amp;family=DM+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=Noto+Sans+JP:wght@500;700&amp;family=Sriracha&amp;display=swap">
<style>
body{margin:0;background:#E3E6EE}
a{color:#A8382B}a:hover{color:#7E2519}
.wrap{font-family:'IBM Plex Sans Thai','Noto Sans JP',system-ui,sans-serif;color:#3B2418;max-width:560px;margin:0 auto;background-color:#FBF4E4;background-image:radial-gradient(#F1E2C8 1.2px,transparent 1.3px);background-size:18px 18px;min-height:100vh}
.jp{font-family:'Noto Sans JP','IBM Plex Sans Thai',sans-serif}
.mono{font-family:'DM Mono','IBM Plex Sans Thai',monospace;text-transform:uppercase;letter-spacing:.06em}
.serif{font-family:'Sriracha','Noto Serif Thai',cursive}
.script{font-family:'Sriracha',cursive;color:#A8382B;font-weight:400}
.hand{font-family:'Sriracha','IBM Plex Sans Thai',cursive}
.sticker{display:inline-block;font-family:'Sriracha',cursive;font-size:15px;color:#4A2C21;border:1.5px solid #4A2C21;border-radius:10px;padding:2px 10px}
.hl{background:#E6DAF0;color:#4E3168;padding:1px 6px}
.tabs{position:sticky;top:0;z-index:5;background:#4A2C21;display:flex;gap:4px;padding:6px 8px;overflow-x:auto}
.tab{flex:1 0 auto;min-height:44px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:#EADFCB;font-family:'DM Mono','IBM Plex Sans Thai',monospace;font-size:13px;font-weight:500;letter-spacing:.04em;cursor:pointer}
.tab.on{background:#FBF7EA;color:#4A2C21}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px;background:#FBF4E4;border-bottom:1.5px solid #4A2C21}
.chip{flex:none;min-width:56px;min-height:52px;border:1.5px solid #4A2C21;border-radius:16px;background:#FFFDF6;color:#3B2418;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 8px}
.chip b{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;line-height:1.2}
.chip span{font-size:11px;color:#6B5446;line-height:1.3}
.chip.on{background:#F6C9D6;border-color:#4A2C21;color:#4A2C21}
.chip.on span{color:#6B2E44}
.chip.today{border:2px solid #A8382B}
.sec{padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:stretch}
.time{width:56px;flex:none;padding-top:12px;font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;line-height:1.25}
.time b{display:block;font-size:14px;font-weight:500;color:#4A2C21}
.time span{display:block;font-size:11.5px;color:#6B5446}
.card{flex:1;min-width:0;background:#FFFDF6;border:1.5px solid #4A2C21;border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.card.minor{background:transparent;border-style:dashed;border-color:#9C8574}
.card.minor .ttl{font-size:14px;font-weight:500;color:#5A4334;font-family:inherit}
.card.now{border:2px solid #A8382B;box-shadow:4px 4px 0 #F6C9D6}
.card.next{border:2px dashed #A8382B}
.ttl{font-family:'Sriracha','IBM Plex Sans Thai',cursive;font-size:17px;font-weight:400;line-height:1.4;color:#3B2418}
.note{font-size:13.5px;color:#4E3A2E;line-height:1.55}
.meta{font-size:13px;color:#5A4334;line-height:1.5}
.meta em{font-style:normal;font-family:'DM Mono','IBM Plex Sans Thai',monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#A8382B;margin-right:4px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-block;font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:999px;line-height:1.5}
.tag.b{background:#D4EBDC;color:#28563A}
.tag.p{background:#F6C9D6;color:#7A2440}
.tag.c{background:#F8E7A6;color:#5E4210}
.tag.v{background:#E6DAF0;color:#4E3168}
.tag.l{background:#4A2C21;color:#FBF7EA}
.tag.now{background:#A8382B;color:#FFFFFF}
.tag.next{background:#FFFDF6;color:#8E2A1E;border:1px solid #A8382B}
.maplink{display:inline-flex;align-items:center;gap:4px;min-height:32px;font-family:'DM Mono','IBM Plex Sans Thai',monospace;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;text-decoration:underline;text-underline-offset:3px}
.box{background:#FFFDF6;border:1.5px solid #4A2C21;border-radius:20px;padding:14px 15px;display:flex;flex-direction:column;gap:6px}
.box h3{margin:0;font-family:'Sriracha','IBM Plex Sans Thai',cursive;font-size:20px;font-weight:400;line-height:1.25;color:#4A2C21}
.box ul{margin:0;padding-left:18px;font-size:14px;line-height:1.65}
.box p{margin:0;font-size:14px;line-height:1.6}
.warnbox{background:#FCE3C2;border-color:#4A2C21}
.prepbox{background:#D4EBDC;border-color:#4A2C21;color:#3B2418}
.prepbox h3{color:#4A2C21}
.prepbox ul{color:#3B2418}
.dayhead{padding:20px 14px 4px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.dayhead .code{font-family:'DM Mono','IBM Plex Sans Thai',monospace;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid #4A2C21;border-radius:8px;transform:rotate(-2deg);background:#E6DAF0;color:#4E3168;padding:2px 8px}
.dayhead h2{margin:0;font-family:'Sriracha','IBM Plex Sans Thai',cursive;font-size:28px;font-weight:400;line-height:1.15;color:#4A2C21}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:#4A2C21;color:#FBF7EA;border-radius:20px;border:0;padding:14px 16px}
.total b{font-family:'Sriracha',cursive;font-size:24px;font-weight:400}
.total span{font-size:12.5px;color:#EADFCB}
.navrow{display:flex;gap:8px}
.navbtn{flex:1;min-height:48px;border-radius:999px;border:1.5px solid #4A2C21;background:#FFFDF6;font-family:'DM Mono','IBM Plex Sans Thai',monospace;font-size:13px;font-weight:500;color:#4A2C21;cursor:pointer}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px;font-size:14px;line-height:1.55}
.kv dt{color:#6B5446;font-family:'DM Mono','IBM Plex Sans Thai',monospace;font-size:12.5px}
.kv dd{margin:0}
.addr{font-size:20px;font-weight:700;line-height:1.5;background:#C9DDEB;border-radius:14px;padding:10px 12px;color:#3B2418}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td,.tbl th{padding:7px 4px;border-bottom:1px dashed #C9B9A6;text-align:left;vertical-align:top}
.tbl th{font-family:'DM Mono','IBM Plex Sans Thai',monospace;font-weight:500;color:#6B5446;font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px}
</style>

</head>
<body>
<template id="tpl">

<div class="wrap">

<header style="display: flex; flex-direction: column">
<div class="mono" style="background: #4A2C21; color: #FBF7EA; font-size: 11px; padding: 8px 16px; text-align: center">4–12 DEC 2026 · KYOTO → OSAKA · 5 PEOPLE</div>
<div style="background: #D4EBDC; padding: 22px 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; border-bottom: 1.5px solid #4A2C21">
<div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap">
<span class="sticker" style="background: #F6C9D6; transform: rotate(-6deg)">gacha</span>
<span class="sticker" style="background: #F8E7A6; transform: rotate(4deg)">street food</span>
<span class="sticker" style="background: #C9DDEB; transform: rotate(-3deg)">nature</span>
</div>
<div class="mono" style="font-size: 11.5px; color: #4A2C21; margin-top: 8px">WELCOME TO THE WORLD OF…</div>
<h1 class="serif" style="margin: 0; font-size: 44px; font-weight: 400; line-height: 1.1; color: #4A2C21">ญี่ปุ่น Kansai</h1>
<div class="script" style="font-size: 26px; line-height: 1">~ tiny treasures trip ~</div>
<div class="mono hl" style="font-size: 11px; margin-top: 6px; border-radius: 6px">sanrio · sylvanian · secondhand finds</div>
<div style="font-size: 12.5px; color: #3B2418; margin-top: 4px">{{statusLine}}</div>
</div>
</header>

<nav class="tabs" aria-label="หมวดข้อมูล">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" class="tab {{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button>
</sc-for>
</nav>

<sc-if value="{{showDays}}" hint-placeholder-val="{{true}}">
<div class="chips" role="tablist" aria-label="เลือกวัน">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="9">
<button type="button" class="chip {{c.cls}}" onClick="{{c.pick}}"><b>{{c.code}}</b><span>{{c.sub}}</span></button>
</sc-for>
</div>

<div class="dayhead">
<div class="code">{{day.code}} · {{day.dow}} {{day.date}}</div>
<h2>{{day.title}}</h2>
</div>

<div class="sec">
<div class="box prepbox">
<h3>ก่อนออกจากที่พัก</h3>
<ul>
<sc-for list="{{day.prep}}" as="p" hint-placeholder-count="3"><li>{{p}}</li></sc-for>
</ul>
</div>

<div class="legend" aria-label="คำอธิบายป้าย">
<span class="tag b">จองแล้ว</span><span class="tag p">ยังต้องจอง</span><span class="tag c">เงินสด</span><span class="tag l">ห้ามพลาดเวลา</span><span class="tag v">[ตรวจสอบ]</span>
</div>

<sc-for list="{{items}}" as="it" hint-placeholder-count="8">
<div class="row">
<div class="time"><b>{{it.tA}}</b><span>{{it.tB}}</span></div>
<div class="card {{it.cls}}">
<sc-if value="{{it.hasTags}}" hint-placeholder-val="{{false}}">
<div class="tags"><sc-for list="{{it.tags}}" as="g" hint-placeholder-count="1"><span class="tag {{g.k}}">{{g.label}}</span></sc-for></div>
</sc-if>
<div class="ttl">{{it.title}}</div>
<sc-if value="{{it.note}}" hint-placeholder-val="{{false}}"><div class="note">{{it.note}}</div></sc-if>
<sc-if value="{{it.how}}" hint-placeholder-val="{{false}}"><div class="meta"><em>เดินทาง</em> {{it.how}}</div></sc-if>
<sc-if value="{{it.cost}}" hint-placeholder-val="{{false}}"><div class="meta"><em>ค่าใช้จ่าย/คน</em> {{it.cost}}</div></sc-if>
<sc-if value="{{it.map}}" hint-placeholder-val="{{false}}"><a class="maplink" href="{{it.map}}" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>เปิดใน Google Maps</a></sc-if>
</div>
</div>
</sc-for>

<div class="total"><span>รวมระหว่างวัน · {{day.totalNote}}</span><b>{{day.total}}</b></div>

<sc-for list="{{day.extra}}" as="x" hint-placeholder-count="0">
<div class="box">
<h3>{{x.h}}</h3>
<ul><sc-for list="{{x.lines}}" as="ln" hint-placeholder-count="2"><li>{{ln}}</li></sc-for></ul>
</div>
</sc-for>

<div class="box warnbox">
<h3>ข้อควรระวังวันนี้</h3>
<ul><sc-for list="{{day.warn}}" as="w" hint-placeholder-count="3"><li>{{w}}</li></sc-for></ul>
</div>

<div class="navrow">
<button type="button" class="navbtn" onClick="{{prevDay}}" disabled="{{isFirst}}">← วันก่อน</button>
<button type="button" class="navbtn" onClick="{{nextDay}}" disabled="{{isLast}}">วันถัดไป →</button>
</div>
</div>
</sc-if>

<sc-if value="{{showInfo}}" hint-placeholder-val="{{false}}">
<div class="sec">
<div class="box">
<h3>นัดเจอ</h3>
<p><b>สุวรรณภูมิ 22:30 วันพฤหัสที่ 3 ธ.ค.</b></p>
</div>

<div class="box">
<h3>เที่ยวบิน</h3>
<table class="tbl">
<tr><th>ขาไป</th><td>HX780 BKK 01:55 → HKG 05:55<br>HX614 HKG 08:40 → <b>KIX 13:15 (ศ. 4 ธ.ค.)</b></td></tr>
<tr><th>ขากลับ</th><td>HX615 <b>KIX 14:15 (ส. 12 ธ.ค.)</b> → HKG 18:10<br>HX779 HKG 22:10 → <b>BKK 00:25 (13 ธ.ค.)</b></td></tr>
<tr><th>กระเป๋า</th><td>โหลด 23 กก. + ถือขึ้นเครื่อง 7 กก. (ไป-กลับ)</td></tr>
</table>
</div>

<div class="box">
<h3>ที่พัก Kyoto · 4–9 ธ.ค. (5 คืน)</h3>
<p><b>Excellence Inn Nishihonganji</b></p>
<p style="font-size: 13px; color: #6B5446">แสดงให้คนขับแท็กซี่</p>
<div class="addr jp">〒600-8349<br>京都府京都市下京区堺町96</div>
<dl class="kv">
<dt>ที่อยู่</dt><dd>96 Sakaicho, Shimogyo Ward, Kyoto 600-8349</dd>
<dt>เช็กอิน</dt><dd>Self check-in 16:00–23:00</dd>
<dt>เช็กเอาต์</dt><dd>ก่อน 10:00</dd>
</dl>
<a class="maplink" href="https://www.google.com/maps/search/?api=1&amp;query=%E4%BA%AC%E9%83%BD%E5%BA%9C%E4%BA%AC%E9%83%BD%E5%B8%82%E4%B8%8B%E4%BA%AC%E5%8C%BA%E5%A0%BA%E7%94%BA96" target="_blank" rel="noopener">เปิดใน Google Maps</a>
</div>

<div class="box">
<h3>ที่พัก Osaka · 9–12 ธ.ค. (3 คืน)</h3>
<p><b>Dotonbori Shinsaibashi Hotel</b> · ใกล้ Nippombashi</p>
<div class="addr jp" style="font-size: 15px; font-weight: 500; color: #4E3168; background: #E6DAF0">[ตรวจสอบ] ใส่ที่อยู่ภาษาญี่ปุ่นสำหรับแท็กซี่</div>
<dl class="kv">
<dt>เช็กอิน</dt><dd>15:00</dd>
<dt>เช็กเอาต์</dt><dd>ก่อน 10:00</dd>
<dt>หมายเหตุ</dt><dd><b>ไม่รับฝากกระเป๋าก่อนเช็กอิน</b></dd>
</dl>
<a class="maplink" href="https://www.google.com/maps/search/?api=1&amp;query=Dotonbori+Shinsaibashi+Hotel" target="_blank" rel="noopener">เปิดใน Google Maps</a>
</div>

<div class="box">
<h3>ทั่วไป</h3>
<dl class="kv">
<dt>ห้องพัก</dt><dd>2 / 2 / 1</dd>
<dt>หารเงิน</dt><dd>หาร 5 ทุกอย่าง (Splitwise) · ค่ากิโมโนจ่ายเฉพาะผู้หญิง 3 คน</dd>
<dt>อัตราแลก</dt><dd>¥1 ≈ ฿0.22 · ราคาเป็นต่อคน</dd>
<dt>แอป</dt><dd>ICOCA (บัตรหรือ Apple Pay) · GO (แท็กซี่) · Google Maps (บันทึกแผนที่ออฟไลน์) · Splitwise · Visit Japan Web</dd>
</dl>
</div>

<div class="box">
<h3>สรุปทั้งทริป</h3>
<table class="tbl">
<tr><th>D4 ศ.</th><td>ถึง KIX → Haruka → Teramachi → teamLab → GYUMON</td></tr>
<tr><th>D5 ส.</th><td>ป่าไผ่ Arashiyama → Yusai-tei → Takao → ช้อปปิ้ง Kawaramachi</td></tr>
<tr><th>D6 อา.</th><td>Demachi Futaba → Hakuryu-en → Rurikoin → Nishiki → Gion → ชาบู/สุกี้</td></tr>
<tr><th>D7 จ.</th><td>กิโมโน → Fushimi Inari (เช้า) → Kiyomizu → Uji</td></tr>
<tr><th>D8 อ.</th><td>Ine หมู่บ้านเรือนแพ → ปั่นจักรยาน Amanohashidate</td></tr>
<tr><th>D9 พ.</th><td>ย้ายไป Osaka ผ่าน Nara → Kaiyukan รอบกลางคืน → Dotonbori</td></tr>
<tr><th>D10 พฤ.</th><td>Kuromon → Den Den Town → Shinsaibashi → Umeda + ตลาดคริสต์มาส → ปิ้งย่าง → Donki</td></tr>
<tr><th>D11 ศ.</th><td>Katsuo-ji (วัดดารุมะ) → Namba Yasaka → Dotonbori → Hozenji → Ura-Namba</td></tr>
<tr><th>D12 ส.</th><td>เช็กเอาต์ → KIX (ศุลกากร Tax-free) → บินกลับ</td></tr>
</table>
</div>
</div>
</sc-if>

<sc-if value="{{showMoney}}" hint-placeholder-val="{{false}}">
<div class="sec">
<div class="box">
<h3>รายการที่จองแล้ว</h3>
<table class="tbl">
<tr><th>รายการ</th><th class="num">ต่อคน</th><th>คนจ่าย / สถานะ</th></tr>
<tr><td>✈️ ตั๋วเครื่องบิน HX (D4 ไป / D12 กลับ)</td><td class="num">฿16,829.51</td><td>จุจุ · <span class="tag b">เคลียร์แล้ว</span></td></tr>
<tr><td>🏨 ที่พัก Kyoto (D4–D9)</td><td class="num">฿5,209.07</td><td>จุจุ · ยังไม่โอน</td></tr>
<tr><td>🎨 teamLab (D4 19:00)</td><td class="num">฿953.10</td><td>หยก · ยังไม่โอน</td></tr>
<tr><td>🖼️ Yusai-tei (D5 11:30)</td><td class="num">฿659.22</td><td>หยก · ยังไม่โอน</td></tr>
<tr><td>🌿 Hakuryu-en (D6 10:00)</td><td class="num">¥1,600</td><td><span class="tag c">จ่ายเองหน้างาน · เงินสด</span></td></tr>
<tr><td>🍁 Rurikoin (D6 13:40)</td><td class="num">~¥2,000</td><td><span class="tag c">จ่ายเองหน้างาน</span> <span class="tag v">[ตรวจสอบ]</span> เตรียม ¥3,000</td></tr>
<tr><td>👘 กิโมโน Miyabi (D7 09:00)</td><td class="num">฿813.77</td><td>หยก · เฉพาะผู้หญิง 3 คน</td></tr>
<tr><td>🏨 ที่พัก Osaka (D9–D12)</td><td class="num">฿3,200</td><td>หยก · เก็บเผื่อค่าเงิน ($463.67)</td></tr>
</table>
<p style="font-size: 13px; color: #6B5446">ยอดตัดบัตรจริง: ตั๋วเครื่องบิน · teamLab · Yusai-tei ฿3,296.11 · กิโมโน ฿2,441.31 · Osaka เก็บ ฿16,000 ส่วนเกินคืนหลังบัตรตัด</p>
</div>

<div class="box prepbox">
<h3>ใครต้องโอนให้ใคร</h3>
<p style="font-size: 13px">ไม่รวมตั๋วเครื่องบิน (เคลียร์แล้ว)</p>
<table class="tbl">
<tr><th>คนโอน</th><th class="num">→ จุจุ</th><th class="num">→ หยก</th><th class="num">รวม</th></tr>
<tr><td>อาย</td><td class="num">5,209.07</td><td class="num">5,626.09</td><td class="num"><b>10,835.16</b></td></tr>
<tr><td>พี่ผึ้ง</td><td class="num">5,209.07</td><td class="num">5,626.09</td><td class="num"><b>10,835.16</b></td></tr>
<tr><td>แก๊ปปี้</td><td class="num">5,209.07</td><td class="num">4,812.32</td><td class="num"><b>10,021.39</b></td></tr>
<tr><td>หยก</td><td class="num">396.75</td><td class="num">–</td><td class="num"><b>396.75</b></td></tr>
<tr><td>จุจุ</td><td class="num">–</td><td class="num">–</td><td class="num"><b>0</b></td></tr>
</table>
<p style="font-size: 13px">→ หยก = teamLab + Yusai-tei + Osaka (฿4,812.32) · ผู้หญิงบวกกิโมโน ฿813.77 · หยก ↔ จุจุ หักลบกันแล้ว</p>
</div>

<div class="box">

var TAG_ORDER = ['p', 'b', 'c', 'l', 'v'];
var TAG_LABEL = { p: 'ยังต้องจอง', b: 'จองแล้ว', c: 'เงินสด', l: 'ห้ามพลาดเวลา', v: '[ตรวจสอบ]' };

function jstNow(ms) {
  var d = new Date(ms + 9 * 3600000);
  return { iso: d.toISOString().slice(0, 10), min: d.getUTCHours() * 60 + d.getUTCMinutes() };
}

function mins(t) {
  var m = t.match(/\d{1,2}:\d{2}/g) || [];
  return m.map(function (x) { var p = x.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); });
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.D = tripDays();
    var j = jstNow(Date.now());
    var idx = this.D.findIndex(function (d) { return d.iso === j.iso; });
    this.state = { tab: 'days', day: idx >= 0 ? idx : 0, now: Date.now() };
  }
  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () { self.setState({ now: Date.now() }); }, 60000);
  }
  componentWillUnmount() { clearInterval(this.timer); }

  renderVals() {
    var self = this;
    var D = this.D;
    var j = jstNow(this.state.now);
    var todayIdx = D.findIndex(function (d) { return d.iso === j.iso; });
    var di = Math.max(0, Math.min(D.length - 1, this.state.day));
    var day = D[di];
    var isToday = di === todayIdx;

    var statusLine;
    if (todayIdx >= 0) {
      statusLine = 'วันนี้ ' + D[todayIdx].code + ' · ' + D[todayIdx].dow + ' ' + D[todayIdx].date + ' (เวลาญี่ปุ่น)';
    } else {
      var start = Date.UTC(2026, 11, 3);
      var todayUTC = Date.parse(j.iso + 'T00:00:00Z');
      var left = Math.round((start - todayUTC) / 86400000);
      statusLine = left > 0 ? ('อีก ' + left + ' วัน · นัดเจอสุวรรณภูมิ 22:30 วันพฤหัสที่ 3 ธ.ค.') : (left === 0 ? 'คืนนี้นัดเจอสุวรรณภูมิ 22:30' : 'จบทริปแล้ว');
    }

    var nowIdx = -1, nextIdx = -1;
    if (isToday) {
      day.items.forEach(function (it, i) {
        var m = mins(it.t);
        if (!m.length) return;
        var s = m[0], e = m.length > 1 ? m[1] : s + 30;
        if (nowIdx < 0 && j.min >= s && j.min < e) nowIdx = i;
      });
      if (nowIdx < 0) {
        nextIdx = day.items.findIndex(function (it) { var m = mins(it.t); return m.length && m[0] > j.min; });
      }
    }

    var items = day.items.map(function (it, i) {
      var parts = it.t.split('–');
      var tags = [];
      if (i === nowIdx) tags.push({ k: 'now', label: 'ตอนนี้' });
      if (i === nextIdx) tags.push({ k: 'next', label: 'ถัดไป' });
      TAG_ORDER.forEach(function (f) { if (it.flags.indexOf(f) >= 0) tags.push({ k: f, label: TAG_LABEL[f] }); });
      var key = it.flags.indexOf('k') >= 0 || it.flags.indexOf('b') >= 0;
      var cls = i === nowIdx ? 'now' : (i === nextIdx ? 'next' : (key ? '' : 'minor'));
      return {
        tA: parts[0], tB: parts.length > 1 && parts[1] ? parts[1] : '',
        title: it.title, note: it.note, how: it.how, cost: it.cost,
        tags: tags, hasTags: tags.length > 0, cls: cls,
        map: it.q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(it.q) : ''
      };
    });

    var chips = D.map(function (d, i) {
      var cls = (i === di ? 'on' : '') + (i === todayIdx ? ' today' : '');
      return { code: d.code, sub: d.dow + ' ' + d.date.replace(' ธ.ค.', ''), cls: cls, pick: function () { self.setState({ day: i, tab: 'days' }); } };
    });

    var tabDefs = [['days', 'แผนรายวัน'], ['info', 'ข้อมูลหลัก'], ['money', 'จอง · เงิน'], ['tips', 'ข้อควรระวัง']];
    var tabs = tabDefs.map(function (t) {
      return { label: t[1], cls: self.state.tab === t[0] ? 'on' : '', pick: function () { self.setState({ tab: t[0] }); } };
    });

    return {
      statusLine: statusLine,
      tabs: tabs,
      chips: chips,
      day: day,
      items: items,
      showDays: this.state.tab === 'days',
      showInfo: this.state.tab === 'info',
      showMoney: this.state.tab === 'money',
      showTips: this.state.tab === 'tips',
      isFirst: di === 0,
      isLast: di === D.length - 1,
      prevDay: function () { self.setState({ day: Math.max(0, di - 1) }); },
      nextDay: function () { self.setState({ day: Math.min(D.length - 1, di + 1) }); }
    };
  }
}
